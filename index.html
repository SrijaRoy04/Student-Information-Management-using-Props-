  <!-- Lucide Icons -->

    }

    // ==========================================
    // 2. HEADER COMPONENT (Receives Props)
    // ==========================================
    function Header({
      title,
      subtitle,
      totalStudents,
      averageCgpa,
      searchQuery,
      onSearchChange
    }) {
      return (
        <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
              
              {/* Branding */}
              <div className="flex items-center gap-3">
                <div className="w-12 h-12 rounded-xl bg-gradient-to-tr from-indigo-600 to-blue-500 text-white flex items-center justify-center shadow-lg shadow-indigo-100 flex-shrink-0">
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M12 14l9-5-9-5-9 5 9 5z" />
                    <path strokeLinecap="round" strokeLinejoin="round" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
                  </svg>
                </div>
                <div>
                  <h1 className="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-tight">{title}</h1>
                  <p className="text-xs sm:text-sm text-slate-500">{subtitle}</p>
                </div>
              </div>

              {/* Search Bar */}
              <div className="relative w-full md:w-80">
                <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                  </svg>
                </div>
                <input
                  type="text"
                  placeholder="Search student, roll no, department..."
                  value={searchQuery}
                  onChange={(e) => onSearchChange(e.target.value)}
                  className="w-full pl-10 pr-9 py-2 bg-slate-50 border border-slate-200 rounded-full text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all shadow-inner"
                />
                {searchQuery && (
                  <button
                    onClick={() => onSearchChange('')}
                    className="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600"
                  >
                    ✕
                  </button>
                )}
              </div>
            </div>

            {/* Metric KPI cards passed via props */}
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-5 pt-4 border-t border-slate-100">
              <div className="bg-slate-50 p-3 rounded-xl border border-slate-100">
                <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Total Students</span>
                <span className="text-xl font-extrabold text-slate-800">{totalStudents}</span>
              </div>
              <div className="bg-indigo-50/60 p-3 rounded-xl border border-indigo-100">
                <span className="text-[11px] font-bold text-indigo-500 uppercase tracking-wider block">Average CGPA</span>
                <span className="text-xl font-extrabold text-indigo-700">{averageCgpa.toFixed(2)} <span className="text-xs text-indigo-400 font-medium">/ 10</span></span>
              </div>
              <div className="bg-slate-50 p-3 rounded-xl border border-slate-100">
                <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Current Term</span>
                <span className="text-xl font-extrabold text-slate-800">2024-25</span>
              </div>
              <div className="bg-slate-50 p-3 rounded-xl border border-slate-100">
                <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Passing Bar</span>
                <span className="text-xl font-extrabold text-slate-800">4.00 <span className="text-xs text-slate-400 font-medium">CGPA</span></span>
              </div>
            </div>
          </div>
        </header>
      );
    }

    // ==========================================
    // 3. STUDENT CARD COMPONENT (Receives Props)
    // Displays: Name, Roll Number, Department, Semester, CGPA, Photo
    // ==========================================
    function StudentCard({
      name,
      rollNumber,
      department,
      semester,
      cgpa,
      photo,
      rank
    }) {
      // Dynamic grade label & color badge based on CGPA score
      const getGradeDetails = (score) => {
        if (score >= 9.5) return { label: "Dean's Honor", bg: "bg-amber-100", text: "text-amber-800", bar: "bg-amber-500", ring: "ring-amber-400" };
        if (score >= 9.0) return { label: "Outstanding", bg: "bg-emerald-100", text: "text-emerald-800", bar: "bg-emerald-500", ring: "ring-emerald-400" };
        if (score >= 8.0) return { label: "Distinction", bg: "bg-blue-100", text: "text-blue-800", bar: "bg-blue-500", ring: "ring-blue-400" };
        if (score >= 7.0) return { label: "First Class", bg: "bg-indigo-100", text: "text-indigo-800", bar: "bg-indigo-500", ring: "ring-indigo-400" };
        return { label: "Pass Class", bg: "bg-orange-100", text: "text-orange-800", bar: "bg-orange-500", ring: "ring-orange-400" };
      };

      const grade = getGradeDetails(cgpa);
      const percentage = Math.min(100, (cgpa / 10) * 100);

      return (
        <div className="bg-white rounded-2xl border border-slate-200/80 p-5 shadow-sm hover:shadow-xl transition-all duration-300 hover:-translate-y-1.5 flex flex-col justify-between relative group overflow-hidden">
          
          {/* Top Rank & Standing Badge */}
          <div className="flex items-center justify-between mb-4">
            {rank ? (
              <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-slate-900 text-white shadow-sm">
                Rank #{rank}
              </span>
            ) : (
              <span className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                Student Profile
              </span>
            )}
            <span className={`text-[11px] font-bold px-2.5 py-0.5 rounded-full ${grade.bg} ${grade.text} border border-black/5`}>
              {grade.label}
            </span>
          </div>

          {/* Photo & Identity Section */}
          <div className="flex items-center gap-3.5 mb-4">
            <div className="relative">
              <img
                src={photo}
                alt={name}
                className="w-14 h-14 rounded-full object-cover ring-2 ring-slate-100 shadow-sm"
                onError={(e) => {
                  e.currentTarget.onerror = null;
                  e.currentTarget.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=4f46e5&color=fff&size=128`;
                }}
              />
              <span className={`absolute bottom-0 right-0 w-3.5 h-3.5 rounded-full border-2 border-white ${grade.bar}`} title={`Active Status - ${grade.label}`} />
            </div>
            <div className="min-w-0 flex-1">
              <h3 className="font-bold text-slate-900 text-base leading-tight truncate group-hover:text-indigo-600 transition-colors">
                {name}
              </h3>
              <p className="text-xs font-mono font-medium text-slate-500 mt-1 flex items-center gap-1">
                <span>Roll:</span>
                <span className="bg-slate-100 text-slate-700 px-1.5 py-0.5 rounded text-[11px] font-semibold">
                  {rollNumber}
                </span>
              </p>
            </div>
          </div>

          {/* Department & Semester Info Grid */}
          <div className="bg-slate-50 rounded-xl p-3 border border-slate-100 space-y-2 mb-4">
            <div className="flex justify-between items-center text-xs">
              <span className="text-slate-500 font-medium">Department</span>
              <span className="font-semibold text-slate-800 text-right truncate max-w-[155px]" title={department}>
                {department}
              </span>
            </div>
            <div className="flex justify-between items-center text-xs border-t border-slate-200/50 pt-2">
              <span className="text-slate-500 font-medium">Semester</span>
              <span className="font-semibold text-slate-800">{semester}</span>
            </div>
          </div>

          {/* CGPA Score Gauge */}
          <div className="pt-1 mt-auto">
            <div className="flex justify-between items-baseline mb-1.5">
              <span className="text-[11px] font-bold text-slate-500 uppercase tracking-wider">CGPA Score</span>
              <div className="text-right">
                <span className="text-lg font-black text-slate-900">{Number(cgpa).toFixed(2)}</span>
                <span className="text-xs font-medium text-slate-400"> / 10.0</span>
              </div>
            </div>
            {/* Visual Progress Bar */}
            <div className="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
              <div
                className={`h-full rounded-full transition-all duration-700 ease-out ${grade.bar}`}
                style={{ width: `${percentage}%` }}
              ></div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 4. STUDENT LIST COMPONENT (Receives Props)
    // ==========================================
    function StudentList({
      students,
      sortOrder,
      onSortChange,
      selectedDept,
      onDeptChange,
      departments
    }) {
      return (
        <section className="space-y-6">
          {/* Controls Bar: Department Filter & CGPA Sorting Mechanism */}
          <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
            
            {/* Filter Chips */}
            <div className="flex items-center gap-2 overflow-x-auto pb-1 lg:pb-0 custom-scroll">
              <span className="text-xs font-bold uppercase tracking-wider text-slate-400 mr-1 flex-shrink-0">
                Department:
              </span>
              <button
                onClick={() => onDeptChange('All')}
                className={`text-xs font-semibold px-3 py-1.5 rounded-full transition-all flex-shrink-0 ${
                  selectedDept === 'All'
                    ? 'bg-indigo-600 text-white shadow-sm'
                    : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                }`}
              >
                All Departments
              </button>
              {departments.map((dept) => (
                <button
                  key={dept}
                  onClick={() => onDeptChange(dept)}
                  className={`text-xs font-semibold px-3 py-1.5 rounded-full transition-all flex-shrink-0 ${
                    selectedDept === dept
                      ? 'bg-indigo-600 text-white shadow-sm'
                      : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                  }`}
                >
                  {dept.split(' ')[0]} {/* shortened badge */}
                </button>
              ))}
            </div>

            {/* CGPA Sorting Mechanism (Requested Feature) */}
            <div className="flex items-center gap-2 flex-shrink-0 justify-between sm:justify-start">
              <span className="text-xs font-bold uppercase tracking-wider text-slate-500">
                Sort CGPA:
              </span>
              <div className="inline-flex p-1 bg-slate-100 rounded-xl border border-slate-200/80">
                <button
                  onClick={() => onSortChange('desc')}
                  title="Highest CGPA to Lowest"
                  className={`flex items-center gap-1.5 px-3 py-1 text-xs font-semibold rounded-lg transition-all ${
                    sortOrder === 'desc'
                      ? 'bg-white text-indigo-600 shadow-sm font-bold'
                      : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2.5">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
                  </svg>
                  Highest
                </button>

                <button
                  onClick={() => onSortChange('asc')}
                  title="Lowest CGPA to Highest"
                  className={`flex items-center gap-1.5 px-3 py-1 text-xs font-semibold rounded-lg transition-all ${
                    sortOrder === 'asc'
                      ? 'bg-white text-indigo-600 shadow-sm font-bold'
                      : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2.5">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18" />
                  </svg>
                  Lowest
                </button>

                {sortOrder !== 'none' && (
                  <button
                    onClick={() => onSortChange('none')}
                    title="Reset to default order"
                    className="px-2 py-1 text-xs font-semibold text-rose-600 hover:text-rose-700 hover:bg-rose-50 rounded-lg transition-colors"
                  >
                    Reset
                  </button>
                )}
              </div>
            </div>
          </div>

          {/* Student Grid */}
          {students.length > 0 ? (
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
              {students.map((student, idx) => (
                <StudentCard
                  key={student.id || student.rollNumber}
                  rank={sortOrder === 'desc' ? idx + 1 : undefined}
                  name={student.name}
                  rollNumber={student.rollNumber}
                  department={student.department}
                  semester={student.semester}
                  cgpa={student.cgpa}
                  photo={student.photo}
                />
              ))}
            </div>
          ) : (
            <div className="bg-white rounded-2xl border border-dashed border-slate-300 p-12 text-center max-w-lg mx-auto">
              <div className="w-16 h-16 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                🔎
              </div>
              <h3 className="text-base font-bold text-slate-800">No Student Records Found</h3>
              <p className="text-xs text-slate-500 mt-1 mb-4">
                No students match your query or filters. Try adjusting your parameters.
              </p>
              <button
                onClick={() => {
                  onDeptChange('All');
                  onSortChange('none');
                }}
                className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-lg shadow-sm transition-all"
              >
                Clear All Filters
              </button>
            </div>
          )}
        </section>
      );
    }

    // ==========================================
    // 5. FOOTER COMPONENT (Receives Props)
    // ==========================================
    function Footer({
      portalName,
      academicSession,
      totalCount
    }) {
      return (
        <footer className="mt-auto bg-white border-t border-slate-200 py-6">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
              <p className="text-xs font-bold text-slate-800">{portalName}</p>
              <p className="text-[11px] text-slate-500 mt-0.5">
                Session {academicSession} • Synchronized with Central University Registrar ({totalCount} verified students)
              </p>
            </div>
            <div className="flex items-center gap-3">
              <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                Props Flow Active
              </span>
              <p className="text-[11px] text-slate-400">
                &copy; {new Date().getFullYear()} Student Affairs Portal
              </p>
            </div>
          </div>
        </footer>
      );
    }

    // ==========================================
    // 6. MAIN APP COMPONENT (Root Container)
    // Holds state & passes everything through Props
    // ==========================================
    function App() {
      const [students] = useState(INITIAL_STUDENTS);
      const [sortOrder, setSortOrder] = useState('none'); // 'none' | 'desc' | 'asc'
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedDept, setSelectedDept] = useState('All');

      // Unique departments list
      const departments = useMemo(() => {
        return Array.from(new Set(students.map((s) => s.department)));
      }, [students]);

      // Computed students list using filters + sorting mechanism
      const processedStudents = useMemo(() => {
        let list = [...students];

        // 1. Filter by Department
        if (selectedDept !== 'All') {
          list = list.filter((s) => s.department === selectedDept);
        }

        // 2. Filter by Search Query
        if (searchQuery.trim() !== '') {
          const query = searchQuery.toLowerCase().trim();
          list = list.filter(
            (s) =>
              s.name.toLowerCase().includes(query) ||
              s.rollNumber.toLowerCase().includes(query) ||
              s.department.toLowerCase().includes(query)
          );
        }

        // 3. Mechanism to sort students by CGPA
        if (sortOrder === 'desc') {
          list.sort((a, b) => b.cgpa - a.cgpa);
        } else if (sortOrder === 'asc') {
          list.sort((a, b) => a.cgpa - b.cgpa);
        }

        return list;
      }, [students, sortOrder, searchQuery, selectedDept]);

      // Overall average CGPA metric
      const averageCgpa = useMemo(() => {
        if (!students.length) return 0;
        return students.reduce((acc, curr) => acc + curr.cgpa, 0) / students.length;
      }, [students]);

      return (
        <div className="flex flex-col min-h-screen">
          {/* Header Component with Props */}
          <Header
            title="Student Information Portal"
            subtitle="Undergraduate & Postgraduate Academic Records"
            totalStudents={students.length}
            averageCgpa={averageCgpa}
            searchQuery={searchQuery}
            onSearchChange={setSearchQuery}
          />

          {/* Main Dashboard Workspace */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {/* Student List Component with Props */}
            <StudentList
              students={processedStudents}
              sortOrder={sortOrder}
              onSortChange={setSortOrder}
              selectedDept={selectedDept}
              onDeptChange={setSelectedDept}
              departments={departments}
            />
          </main>

          {/* Footer Component with Props */}
          <Footer
            portalName="EduPortal™ Academic Records"
            academicSession="2024-2025"
            totalCount={students.length}
          />
        </div>
      );
    }

    // Render the App into the root container
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
